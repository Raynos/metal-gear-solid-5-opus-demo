<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>THE PHANTOM PAIN</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #d8d8d0; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }

      #controls-card {
        position: fixed; left: 20px; top: 20px; z-index: 40;
        /* Never taller than the window. A 315px card is fine at 1080 and runs
           off the bottom of a laptop viewport once browser chrome is there. */
        max-height: calc(100vh - 40px); overflow-y: auto;
        padding: 12px 16px 13px; pointer-events: none;
        background: rgba(8, 10, 12, 0.62);
        border: 1px solid rgba(216, 216, 208, 0.16);
        backdrop-filter: blur(6px);
        font: 11px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: 0.09em; color: rgba(216, 216, 208, 0.78);
        transition: opacity 240ms ease; opacity: 1;
      }
      #controls-card[hidden] { display: block; opacity: 0; }
      #controls-card h4 {
        margin: 0 0 10px; font-size: 10px; font-weight: 500;
        letter-spacing: 0.28em; color: rgba(216, 216, 208, 0.95);
        display: flex; justify-content: space-between; gap: 24px;
      }
      #controls-card h4 span { opacity: 0.4; letter-spacing: 0.14em; }
      /* Two columns of pairs, so the card is half as tall. */
      #controls-card dl {
        margin: 0; display: grid;
        grid-template-columns: auto 1fr auto 1fr;
        gap: 2px 12px; align-items: baseline;
      }
      @media (max-height: 780px), (max-width: 900px) {
        #controls-card { font-size: 10px; padding: 9px 12px 10px; }
        #controls-card dl { gap: 1px 9px; }
      }
      /* Collapsed: just the hint line, so it never covers the game. */
      #controls-card.mini dl { display: none; }
      #controls-card.mini h4 { margin: 0; }
      #controls-card dt {
        text-align: right; color: rgba(216, 216, 208, 0.95);
        font-variant-numeric: tabular-nums; white-space: nowrap;
      }
      #controls-card dd { margin: 0; opacity: 0.72; }
      #controls-card em { font-style: normal; opacity: 0.45; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>

    <!--
      Core controls card. The UI module owns the HUD; this is deliberately
      separate and deliberately dumb, because a player who cannot discover how
      to shoot has no way to find out that the rest exists. It hides itself if
      the UI module publishes its own controls panel.
      Toggle with H or ?.
    -->
    <div id="controls-card">
      <h4>CONTROLS <span>H</span></h4>
      <dl>
        <dt>W A S D</dt><dd>move</dd>
        <dt>Mouse / Arrows</dt><dd>look</dd>
        <dt>Shift</dt><dd>sprint</dd>
        <dt>C</dt><dd>crouch</dd>
        <dt>Z</dt><dd>prone</dd>
        <dt>E <em>or</em> RMB</dt><dd>aim</dd>
        <dt>Space <em>or</em> LMB</dt><dd>fire</dd>
        <dt>F</dt><dd>CQC takedown <em>(behind an unaware guard)</em></dd>
        <dt>R</dt><dd>drag body</dd>
        <dt>T</dt><dd>reload</dd>
        <dt>G</dt><dd>take cover</dd>
        <dt>V</dt><dd>swap shoulder</dd>
        <dt>Esc</dt><dd>menu</dd>
      </dl>
    </div>
    <script>
      // Plain script, not a module: the controls card must work even if the
      // game bundle fails to boot, which is exactly when you want to read it.
      (function () {
        var card = document.getElementById('controls-card');
        var hidden = false;
        function toggle(v) { hidden = v; card.toggleAttribute('hidden', hidden); }
        // Three states, cycled with H: full -> mini -> off. Mini is the default
        // after a few seconds so the card teaches once and then gets out of the way.
        var state = 0; // 0 full, 1 mini, 2 hidden
        function apply() {
          card.classList.toggle('mini', state === 1);
          card.toggleAttribute('hidden', state === 2);
        }
        addEventListener('keydown', function (e) {
          if (e.code === 'KeyH' || e.key === '?') { state = (state + 1) % 3; apply(); }
        });
        setTimeout(function () { if (state === 0) { state = 1; apply(); } }, 12000);
        // Stand aside for the UI module's own panel if one appears.
        addEventListener('load', function () {
          setTimeout(function () {
            if (document.querySelector('#ui [data-controls]')) card.remove();
          }, 1200);
        });
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
